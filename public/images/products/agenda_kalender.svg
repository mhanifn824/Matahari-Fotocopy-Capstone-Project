<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e8e2d5"/>
    </linearGradient>
    <linearGradient id="calCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="agendaCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Desk -->
  <rect width="600" height="450" fill="url(#deskGrad)"/>

  <!-- Subtle grid pattern on background -->
  <g opacity="0.3" stroke="#cbd5e1" stroke-width="0.5">
    <line x1="50" y1="0" x2="50" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="250" y1="0" x2="250" y2="450"/>
    <line x1="350" y1="0" x2="350" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="550" y1="0" x2="550" y2="450"/>
  </g>

  <!-- Hardcover Agenda Book (Right) -->
  <g filter="url(#shadow)" transform="translate(320, 110) rotate(-6)">
    <!-- Book Shadow & Base -->
    <rect x="0" y="0" width="200" height="260" rx="12" fill="url(#agendaCover)"/>
    <!-- Gold Ribbon Bookmark -->
    <path d="M 120 0 L 120 280 L 132 265 L 144 280 L 144 0 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Gold Foil Title Emboss -->
    <rect x="35" y="80" width="130" height="2" fill="url(#goldGrad)"/>
    <text x="100" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">AGENDA 2026</text>
    <text x="100" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">EXECUTIVE NOTEBOOK</text>
    <rect x="60" y="165" width="80" height="1.5" fill="url(#goldGrad)"/>
    <!-- Elastic Band -->
    <rect x="170" y="0" width="14" height="260" fill="#090d16" opacity="0.6"/>
  </g>

  <!-- Desk Tent Calendar (Left) -->
  <g filter="url(#shadow)" transform="translate(70, 90)">
    <!-- Calendar Tent Base Stand -->
    <polygon points="10,280 230,280 250,300 0,300" fill="#64748b" opacity="0.4"/>
    <!-- Calendar Pages -->
    <rect x="20" y="30" width="200" height="250" rx="8" fill="url(#calCover)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Spiral Binding Rings at Top -->
    <g fill="#475569">
      <rect x="35" y="20" width="8" height="20" rx="3"/>
      <rect x="60" y="20" width="8" height="20" rx="3"/>
      <rect x="85" y="20" width="8" height="20" rx="3"/>
      <rect x="110" y="20" width="8" height="20" rx="3"/>
      <rect x="135" y="20" width="8" height="20" rx="3"/>
      <rect x="160" y="20" width="8" height="20" rx="3"/>
      <rect x="185" y="20" width="8" height="20" rx="3"/>
    </g>

    <!-- Calendar Month Header -->
    <rect x="20" y="40" width="200" height="50" fill="#0284c7"/>
    <text x="120" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">NOVEMBER 2026</text>
    
    <!-- Mini Calendar Grid -->
    <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">
      <text x="45" y="115" font-weight="bold" fill="#ef4444">M</text>
      <text x="70" y="115" font-weight="bold">S</text>
      <text x="95" y="115" font-weight="bold">S</text>
      <text x="120" y="115" font-weight="bold">R</text>
      <text x="145" y="115" font-weight="bold">K</text>
      <text x="170" y="115" font-weight="bold">J</text>
      <text x="195" y="115" font-weight="bold">S</text>

      <!-- Dates Sample -->
      <text x="45" y="145" fill="#ef4444">1</text><text x="70" y="145">2</text><text x="95" y="145">3</text><text x="120" y="145">4</text><text x="145" y="145">5</text><text x="170" y="145">6</text><text x="195" y="145">7</text>
      <text x="45" y="175" fill="#ef4444">8</text><text x="70" y="175">9</text><text x="95" y="175">10</text><text x="120" y="175">11</text><text x="145" y="175">12</text><text x="170" y="175">13</text><text x="195" y="175">14</text>
      <text x="45" y="205" fill="#ef4444">15</text><text x="70" y="205">16</text><text x="95" y="205">17</text><text x="120" y="205">18</text><text x="145" y="205">19</text><text x="170" y="205">20</text><text x="195" y="205">21</text>
      <text x="45" y="235" fill="#ef4444">22</text><text x="70" y="235">23</text><text x="95" y="235">24</text><text x="120" y="235">25</text><text x="145" y="235">26</text><text x="170" y="235">27</text><text x="195" y="235">28</text>
    </g>

    <circle cx="120" cy="202" r="11" fill="none" stroke="#0284c7" stroke-width="2"/>
  </g>
</svg>
