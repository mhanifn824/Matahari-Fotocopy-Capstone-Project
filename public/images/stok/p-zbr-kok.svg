<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#f0fdf4"/>
  <!-- Pen barrel slanted -->
  <g transform="rotate(-35 50 50)">
    <rect x="46" y="25" width="8" height="50" rx="2" fill="url(#penBody)"/>
    <!-- Clear grip section -->
    <rect x="46" y="55" width="8" height="15" fill="#bae6fd" opacity="0.8"/>
    <line x1="46" y1="58" x2="54" y2="58" stroke="#0284c7" stroke-width="0.8"/>
    <line x1="46" y1="62" x2="54" y2="62" stroke="#0284c7" stroke-width="0.8"/>
    <line x1="46" y1="66" x2="54" y2="66" stroke="#0284c7" stroke-width="0.8"/>
    <!-- Pen Tip Cone -->
    <polygon points="46,75 54,75 50,85" fill="#94a3b8"/>
    <circle cx="50" cy="85" r="1" fill="#0f172a"/>
    <!-- Clicker top -->
    <rect x="48" y="20" width="4" height="6" rx="1" fill="#64748b"/>
    <!-- Clip -->
    <rect x="43" y="27" width="3" height="18" rx="1.5" fill="#38bdf8"/>
  </g>
  <text x="50" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="bold" fill="#059669" text-anchor="middle">ZEBRA KOKORO 0.5</text>
</svg>
