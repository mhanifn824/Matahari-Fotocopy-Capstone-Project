<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#fafaf9"/>
  <!-- Hardcover Book board with gold border -->
  <rect x="22" y="22" width="56" height="60" rx="4" fill="#1c1917" stroke="#d97706" stroke-width="2"/>
