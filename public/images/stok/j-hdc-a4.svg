  <rect x="22" y="22" width="10" height="60" fill="#292524"/>
  <!-- Gold ornament box -->
  <rect x="38" y="34" width="34" height="36" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55" y="48" font-family="serif" font-size="3" font-weight="bold" fill="#fbbf24" text-anchor="middle">SKRIPSI</text>
  <text x="55" y="55" font-family="sans-serif" font-size="2.2" fill="#d6d3d1" text-anchor="middle">HARDCOVER</text>
  <text x="55" y="61" font-family="monospace" font-size="2.5" fill="#f59e0b" text-anchor="middle">NO. 30</text>
